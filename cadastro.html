<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta | Felíria Joias</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">
        <h1>Felíria Joias</h1>
        <p>Crie sua conta</p>

        <form id="cadastro-form">
            <label for="nome">Nome completo</label>
            <input type="text" id="nome" placeholder="Digite seu nome" required>

            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="Digite seu e-mail" required>

            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Crie uma senha" required>

            <label for="confirmar-senha">Confirmar senha</label>
            <input type="password" id="confirmar-senha" placeholder="Repita sua senha" required>

            <button type="submit">CRIAR CONTA</button>
        </form>

        <p class="cadastro">
            Já tem uma conta? <a href="index.html">Entrar</a>
        </p>
    </div>

    <script src="script.js"></script>
</body>

</html>
